name: CI

on:
  push:
    branches:
      - master
      - "codex/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: market-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify Marketplace release tree
        run: python scripts/verify.py
